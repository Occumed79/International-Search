name: Provider evidence qualification
on:
  push:
    paths:
      - 'api-server/src/services/groqQualification.ts'
      - 'api-server/src/services/apiProviderSearch.ts'
      - 'api-server/tests/groqQualification.test.mjs'
      - 'api-server/package.json'
      - '.github/workflows/provider-qualification.yml'
  pull_request:
    paths:
      - 'api-server/src/services/groqQualification.ts'
      - 'api-server/src/services/apiProviderSearch.ts'
      - 'api-server/tests/groqQualification.test.mjs'
      - 'api-server/package.json'
      - '.github/workflows/provider-qualification.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test api-server/tests/groqQualification.test.mjs
