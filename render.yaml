services:
  - type: web
    name: international-search
    runtime: node
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install --prod=false --no-frozen-lockfile && PORT=10000 BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/price-intel build && pnpm --filter @workspace/api-server build
    startCommand: sh ./start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: NEON_DATABASE_URL
        sync: false
      - key: MAPTILER_API_KEY
        sync: false
      - key: KEENABLE_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: VITE_HUB_URL
        value: https://insight-hub2-0-fz26.onrender.com
